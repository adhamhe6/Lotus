<!-- Navbar (Div 1) -->
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">
            <a href="{% url 'home' %}"><i class="fas fa-spa"></i> <span class="text-lotus">Lotus</span></a>
        </div>
        <div class="nav-menu" id="nav-menu">
            <a href="{% url 'products' %}" class="nav-link text-nav-products">Products</a>
            <a href="{% url 'services' %}" class="nav-link text-nav-services">Services</a>
            <div class="nav-link dropdown">
                <span class="text-nav-company">Company <i class="fas fa-chevron-down"></i></span>
                <div class="dropdown-content">
                    <a href="{% url 'about' %}" class="text-nav-about">About</a>
                    <a href="{% url 'contact' %}" class="text-nav-contact">Contact</a>
                    <a href="{% url 'executive_team' %}" class="text-nav-team">Executive Team</a>
                    <a href="{% url 'newsroom' %}" class="text-nav-news">Newsroom</a>
                    <a href="{% url 'careers' %}" class="text-nav-careers">Careers</a>
                </div>
            </div>
            <a href="{% url 'industries' %}" class="nav-link text-nav-industries">Industries</a>
            <a href="{% url 'resources' %}" class="nav-link text-nav-resources">Resources</a>
            <a href="{% url 'design_your_tool' %}" class="nav-link text-nav-design">Design Your Tool</a>
        </div>
        <div class="nav-buttons">
            <button id="language-toggle" class="lang-btn">العربية</button>
            
            {% if user.is_authenticated %}
            <div class="nav-user">
                <button class="nav-user-btn">
                    <div class="nav-user-avatar">
                        {% if user.profile.avatar %}
                            <img src="{{ user.profile.avatar.url }}" alt="{{ user.get_full_name }}">
                        {% else %}
                            <i class="fas fa-user"></i>
                        {% endif %}
                    </div>

                    <span class="nav-user-name">{{ user.first_name|default:user.username }}</span>
                    <i class="fas fa-chevron-down"></i>
                </button>

                <div class="nav-user-dropdown">
                    <a href="{% url 'profile' %}">
                        <i class="fas fa-user"></i> My Profile
                    </a>
                    <a href="{% url 'dashboard' %}">
                        <i class="fas fa-chart-bar"></i> Dashboard
                    </a>
                    <a href="{% url 'my_projects' %}">
                        <i class="fas fa-project-diagram"></i> My Projects
                    </a>

                    <div class="divider"></div>

                    <a href="{% url 'logout' %}" class="logout">
                        <i class="fas fa-sign-out-alt"></i> Sign Out
                    </a>
                </div>
            </div>
            {% else %}
            <a href="{% url 'login' %}" class="nav-auth-btn login-btn">Sign In</a>
            <a href="{% url 'signup' %}" class="nav-auth-btn signup-btn">Sign Up</a>
            {% endif %}

            
            <button class="buy-btn text-nav-buy" onclick="location.href='{% url 'products' %}'">Buy</button>
            <button class="demo-btn text-nav-demo" onclick="location.href='{% url 'contact' %}'">Request a Demo</button>
            <div class="search-icon" id="search-toggle">
                <i class="fas fa-search"></i>
            </div>
        </div>
        <div class="hamburger" id="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </div>
</nav>

<!-- Search Modal -->
<div id="search-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <form class="search-form" action="{% url 'resources' %}" method="get">
            <input type="text" placeholder="Search research, analysis, tools..." name="search" class="text-search-placeholder">
            <button type="submit"><i class="fas fa-search"></i></button>
        </form>
    </div>
</div>

<style>
/* Add these styles to your existing CSS */

.nav-auth-btn {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s ease;
}

.login-btn {
    color: var(--primary);
    border: 1px solid var(--primary);
    background: transparent;
}

.login-btn:hover {
    background: var(--primary);
    color: white;
}

.signup-btn {
    background: var(--accent);
    color: white;
    border: 1px solid var(--accent);
}

.signup-btn:hover {
    background: #1f8c8f;
    border-color: #1f8c8f;
}

.buy-btn, .demo-btn {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: none;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.buy-btn {
    background: var(--secondary);
    color: var(--primary);
}

.buy-btn:hover {
    background: #d4a236;
    transform: translateY(-2px);
}

.demo-btn {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--primary);
}

.demo-btn:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-2px);
}

/* Active link styling */
.nav-link.active {
    color: var(--accent);
    font-weight: 600;
    position: relative;
}

.nav-link.active::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--accent);
    border-radius: 1px;
}

.user-dropdown {
    position: relative;
    display: inline-block;
}

.user-menu {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem;
    background: transparent;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.user-menu:hover {
    border-color: var(--accent);
}

.user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.8rem;
}

.user-avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

.user-name {
    font-weight: 600;
    color: var(--primary);
    font-size: 0.9rem;
}

.user-dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    top: 100%;
    background: white;
    min-width: 200px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    border-radius: 8px;
    padding: 0.5rem;
    z-index: 1000;
    margin-top: 0.5rem;
}

.user-dropdown:hover .user-dropdown-content {
    display: block;
}

.dropdown-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    text-decoration: none;
    color: #333;
    border-radius: 6px;
    transition: all 0.3s ease;
    font-size: 0.9rem;
}

.dropdown-item:hover {
    background: #f8f9fa;
    color: var(--primary);
}

.dropdown-item.logout {
    color: #d32f2f;
}

.dropdown-item.logout:hover {
    background: #ffeaea;
}

.dropdown-divider {
    height: 1px;
    background: #eee;
    margin: 0.5rem 0;
}

/* RTL Support */
body.rtl .user-dropdown-content {
    right: auto;
    left: 0;
}

body.rtl .user-menu {
    flex-direction: row-reverse;
}

body.rtl .dropdown-item {
    flex-direction: row-reverse;
}

@media (max-width: 768px) {
    .nav-auth-btn {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
    }
    
    .buy-btn, .demo-btn {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
    }
    
    .user-name {
        display: none;
    }
}

/* -----------------------------------------------------------
   USER NAV STYLE — Matches Lotus Navbar
------------------------------------------------------------ */

.nav-user {
    position: relative;
}

.nav-user-btn {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0.4rem 0.7rem;
    border-radius: 6px;
    transition: 0.25s ease;
}

.nav-user-btn:hover {
    background: rgba(0, 0, 0, 0.05);
}

.nav-user-avatar {
    width: 32px;
    height: 32px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    overflow: hidden;
    font-size: 0.8rem;
}

.nav-user-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.nav-user-name {
    font-weight: 600;
    color: var(--primary);
    font-size: 0.9rem;
}

/* Dropdown */

.nav-user-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 110%;
    background: #fff;
    min-width: 220px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    border-radius: 10px;
    padding: 0.6rem 0;
    z-index: 1000;
    animation: fadeIn 0.15s ease;
}

.nav-user:hover .nav-user-dropdown {
    display: block;
}

.nav-user-dropdown a {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: #333;
    padding: 0.75rem 1rem;
    text-decoration: none;
    font-size: 0.92rem;
    transition: 0.2s ease;
}

.nav-user-dropdown a:hover {
    background: #f4f7ff;
    color: var(--primary);
}

.nav-user-dropdown a.logout {
    color: #d32f2f;
}

.nav-user-dropdown a.logout:hover {
    background: #ffecec;
}

.nav-user-dropdown .divider {
    height: 1px;
    background: #eee;
    margin: 0.4rem 0;
}

/* RTL Support */
body.rtl .nav-user-dropdown {
    right: auto;
    left: 0;
}

/* Mobile */
@media (max-width: 768px) {
    .nav-user-name { display: none; }
}

/* Highlight the dropdown box when visible */
.nav-user:hover .nav-user-dropdown {
    display: block;
    border: 2px solid var(--primary);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    background: #fff;
}

/* Search Modal Styles */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal-content {
    background-color: #fefefe;
    margin: 15% auto;
    padding: 2rem;
    border-radius: 12px;
    width: 90%;
    max-width: 600px;
    position: relative;
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    right: 1rem;
    top: 1rem;
    cursor: pointer;
}

.close:hover {
    color: var(--primary);
}

.search-form {
    display: flex;
    gap: 0.5rem;
}

.search-form input {
    flex: 1;
    padding: 1rem;
    border: 2px solid #e1e5e9;
    border-radius: 8px;
    font-size: 1rem;
}

.search-form button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 1rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
}

.search-form button:hover {
    background: #1f8c8f;
}

/* Mobile menu styles */
.hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
}

.bar {
    width: 25px;
    height: 3px;
    background-color: var(--primary);
    margin: 3px 0;
    transition: 0.3s;
}

@media (max-width: 768px) {
    .hamburger {
        display: flex;
    }
    
    .nav-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: white;
        flex-direction: column;
        padding: 1rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .nav-menu.active {
        display: flex;
    }
    
    .nav-buttons {
        display: none;
    }
    
    .nav-buttons.active {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: white;
        padding: 1rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        gap: 0.5rem;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // User dropdown functionality
    const userBtn = document.querySelector('.nav-user-btn');
    const userDropdown = document.querySelector('.nav-user-dropdown');
    
    if (userBtn && userDropdown) {
        userBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            userDropdown.style.display = userDropdown.style.display === 'block' ? 'none' : 'block';
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function() {
            userDropdown.style.display = 'none';
        });
    }
    
    // Search modal functionality
    const searchToggle = document.getElementById('search-toggle');
    const searchModal = document.getElementById('search-modal');
    const closeBtn = document.querySelector('.close');
    
    if (searchToggle && searchModal) {
        searchToggle.addEventListener('click', function() {
            searchModal.style.display = 'block';
        });
        
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                searchModal.style.display = 'none';
            });
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === searchModal) {
                searchModal.style.display = 'none';
            }
        });
    }
    
    // Mobile menu functionality
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');
    const navButtons = document.querySelector('.nav-buttons');
    
    if (hamburger && navMenu) {
        hamburger.addEventListener('click', function() {
            navMenu.classList.toggle('active');
            if (navButtons) {
                navButtons.classList.toggle('active');
            }
            hamburger.classList.toggle('active');
        });
    }
    
    // Set active link based on current page
    function setActiveLink() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
            const linkPath = link.getAttribute('href');
            if (linkPath && currentPath.includes(linkPath.replace('/', ''))) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    }
    
    setActiveLink();
    
    // Language toggle functionality
    const languageToggle = document.getElementById('language-toggle');
    if (languageToggle) {
        languageToggle.addEventListener('click', function() {
            const currentLang = this.textContent;
            this.textContent = currentLang === 'العربية' ? 'English' : 'العربية';
            document.body.classList.toggle('rtl');
            
            // You can add actual language switching logic here
            // For now, we're just toggling the RTL class for demo
        });
    }
});
</script>
